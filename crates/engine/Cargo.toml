[package]
name = "wordcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft engine: session, selection, undo, the command registry (every action is a command), Word's command catalog, file I/O dispatch"

[lints]
workspace = true

[features]
# One feature per extension (see src/extensions.rs); `full` is every one.
default = ["full"]
full = ["comments", "proofing", "references", "equation-editor", "shapes", "charts", "smart-art", "wordart", "ink", "mailings", "developer", "macros", "compare", "read-aloud", "accessibility", "design", "templates", "restrict-editing", "pdf-export", "doc-legacy", "zotero"]
comments = []
proofing = []
references = []
equation-editor = []
shapes = []
charts = ["shapes"]
smart-art = ["shapes"]
wordart = ["shapes"]
ink = ["shapes"]
mailings = ["references"]
developer = []
macros = []
compare = []
read-aloud = []
accessibility = []
design = []
templates = []
restrict-editing = []
pdf-export = ["dep:wordcraft-pdf"]
doc-legacy = ["dep:wordcraft-docbin"]
# The front end's Zotero connection; nothing in the engine, but one manifest.
zotero = ["references"]

[dependencies]
wordcraft-geom = { workspace = true }
wordcraft-doc = { workspace = true }
wordcraft-fonts = { workspace = true }
wordcraft-layout = { workspace = true }
wordcraft-render = { workspace = true }
wordcraft-proof = { workspace = true }
wordcraft-docx = { workspace = true }
wordcraft-docbin = { workspace = true, optional = true }
wordcraft-pdf = { workspace = true, optional = true }
wordcraft-formats = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
regex-automata = { workspace = true }
image = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock for `now_iso` (`SystemTime::now()` panics on wasm32).
js-sys = "0.3"

[dev-dependencies]
zip = { workspace = true }
