[package]
name = "wordcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft egui front end (Word-style ribbon UI); swappable: nothing below depends on it"

[lints]
workspace = true

[features]
# The engine's extensions (see crates/engine/src/extensions.rs), forwarded; `full` is all.
default = ["full"]
full = ["comments", "proofing", "references", "equation-editor", "shapes", "charts", "smart-art", "wordart", "ink", "mailings", "developer", "macros", "compare", "read-aloud", "accessibility", "design", "templates", "restrict-editing", "pdf-export", "doc-legacy", "zotero"]
comments = ["wordcraft-engine/comments"]
proofing = ["wordcraft-engine/proofing"]
references = ["wordcraft-engine/references"]
equation-editor = ["wordcraft-engine/equation-editor"]
shapes = ["wordcraft-engine/shapes"]
charts = ["wordcraft-engine/charts"]
smart-art = ["wordcraft-engine/smart-art"]
wordart = ["wordcraft-engine/wordart"]
ink = ["wordcraft-engine/ink"]
mailings = ["wordcraft-engine/mailings"]
developer = ["wordcraft-engine/developer"]
macros = ["wordcraft-engine/macros"]
compare = ["wordcraft-engine/compare"]
read-aloud = ["wordcraft-engine/read-aloud"]
accessibility = ["wordcraft-engine/accessibility"]
design = ["wordcraft-engine/design"]
templates = ["wordcraft-engine/templates"]
restrict-editing = ["wordcraft-engine/restrict-editing"]
pdf-export = ["wordcraft-engine/pdf-export"]
doc-legacy = ["wordcraft-engine/doc-legacy"]
zotero = ["wordcraft-engine/zotero", "references", "dep:wordcraft-zotero"]

[dependencies]
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "d27646a5f7c8b4fc85d9dd3213b8c88b58e0088d" }
wordcraft-geom = { workspace = true }
wordcraft-doc = { workspace = true }
unicode-bidi = { workspace = true }
wordcraft-fonts = { workspace = true }
wordcraft-layout = { workspace = true }
wordcraft-render = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-zotero = { workspace = true, optional = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Pictures pasted from the system clipboard arrive as pixels and are inserted as PNG (#45).
image = { workspace = true }
# The system's preferred interface languages (#8) and region (#838). Native: OS APIs; wasm:
# the browser's languages (`js`).
sys-locale = { version = "0.3", features = ["js"] }

# Linux only, where winit reports no system theme: the desktop portal's light/dark answer (see
# `desktop_theme.rs`). Already in the tree, with these features, through egui's own accessibility
# bus; pinned to one version so nothing is built twice.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock (`SystemTime::now()`/`Instant::now()` panic on wasm32).
js-sys = "0.3"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
zip = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
